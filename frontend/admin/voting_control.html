<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Voting Control — Tomorrow Vote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .control-btn-card {
            border-radius: 16px;
            padding: 26px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 2px solid transparent;
        }
        .control-btn-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        .file-item {
            padding: 14px 18px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            transition: background 0.15s ease;
        }
        .file-item:hover {
            background: #f1f5f9;
        }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script>
        (async function() {
            const user = await initPage('admin', 'voting_control');
            if (!user) return;

            const render = async () => {
                const { status } = await api.admin.dashboard();
                const { backups } = await api.admin.backups();
                const isOpen = status === 'OPEN';

                let backupsHtml = (backups && backups.length) ? backups.map(b => `
                    <div class="file-item">
                        <div style="display: flex; align-items: center; gap: 12px;">
                            <div style="width: 38px; height: 38px; border-radius: 8px; background: #fee2e2; color: #dc2626; display: flex; align-items: center; justify-content: center;">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                            </div>
                            <div>
                                <div style="font-weight: 700; color: #0f172a; font-size: 14px;">${b.filename}</div>
                                <div style="color: #64748b; font-size: 12px; margin-top: 2px;">${b.size} &bull; ${b.time}</div>
                            </div>
                        </div>
                        <button onclick="downloadArchivedPdf('${b.filename}')" style="display: inline-flex; align-items: center; gap: 6px; background: #2563eb; color: #ffffff; padding: 8px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Download PDF
                        </button>
                    </div>
                `).join('') : '<div style="padding: 24px; text-align: center; color: #64748b; font-weight: 500;">No archived reports found. Resetting election records automatically generates certified PDF archives here.</div>';

                const content = `
                    <div class="animate-fade-in-up">
                    <!-- Header Box -->
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 14px;">
                        <div>
                            <h1 style="font-size: 26px; font-weight: 900; margin: 0 0 4px 0;">Voting Status & System Control</h1>
                            <p style="font-size: 14px; color: #64748b; margin: 0; font-weight: 500;">Manage election state, ballot intake, and archival audits</p>
                        </div>
                        <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                            <button onclick="downloadLivePdf()" style="background: #2563eb; color: #ffffff; padding: 9px 18px; border-radius: 10px; border: none; font-weight: 800; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                Export Live Audit PDF
                            </button>
                            <div style="display: inline-flex; align-items: center; gap: 8px; padding: 8px 18px; border-radius: 30px; font-weight: 800; font-size: 13px; background: ${isOpen ? '#dcfce7' : '#fee2e2'}; color: ${isOpen ? '#15803d' : '#990000'}; border: 1.5px solid ${isOpen ? '#bbf7d0' : '#fecaca'};">
                                <span class="pulse-dot" style="width: 8px; height: 8px; border-radius: 50%; background: ${isOpen ? '#22c55e' : '#ef4444'};"></span>
                                ACTIVE STATUS: ${status}
                            </div>
                        </div>
                    </div>

                    <!-- Toggle Control Cards -->
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 28px;">
                        <!-- Open Voting Button Card -->
                        <div class="control-btn-card" style="background: ${isOpen ? 'linear-gradient(135deg, #15803d 0%, #16a34a 100%)' : '#ffffff'}; color: ${isOpen ? '#ffffff' : '#0f172a'}; border-color: #16a34a; box-shadow: ${isOpen ? '0 8px 24px rgba(220, 38, 38, 0.25)' : 'none'};" onclick="setStatus('OPEN')">
                            <div style="width: 56px; height: 56px; border-radius: 50%; background: ${isOpen ? 'rgba(255,255,255,0.2)' : '#dcfce7'}; color: ${isOpen ? '#ffffff' : '#15803d'}; display: flex; align-items: center; justify-content: center;">
                                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>
                            </div>
                            <h2 style="font-size: 20px; font-weight: 900; margin: 0;">Open Election Voting</h2>
                            <p style="font-size: 13px; margin: 0; opacity: 0.9; max-width: 320px;">Permit registered student voters to access ballots and record votes.</p>
                            ${isOpen ? '<span style="font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 20px; margin-top: 4px;">CURRENTLY ACTIVE</span>' : ''}
                        </div>

                        <!-- Close Voting Button Card -->
                        <div class="control-btn-card" style="background: ${!isOpen ? 'linear-gradient(135deg, #b91c1c 0%, #dc2626 100%)' : '#ffffff'}; color: ${!isOpen ? '#ffffff' : '#0f172a'}; border-color: #dc2626; box-shadow: ${!isOpen ? '0 8px 24px rgba(220, 38, 38, 0.25)' : 'none'};" onclick="setStatus('CLOSED')">
                            <div style="width: 56px; height: 56px; border-radius: 50%; background: ${!isOpen ? 'rgba(255,255,255,0.2)' : '#fee2e2'}; color: ${!isOpen ? '#ffffff' : '#dc2626'}; display: flex; align-items: center; justify-content: center;">
                                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            </div>
                            <h2 style="font-size: 20px; font-weight: 900; margin: 0;">Close Election Voting</h2>
                            <p style="font-size: 13px; margin: 0; opacity: 0.9; max-width: 320px;">Lock the voting booth. Prevents any new ballot submissions.</p>
                            ${!isOpen ? '<span style="font-size: 11px; font-weight: 800; background: rgba(255,255,255,0.25); padding: 4px 12px; border-radius: 20px; margin-top: 4px;">CURRENTLY CLOSED</span>' : ''}
                        </div>
                    </div>

                    <!-- Reset & Archive Card -->
                    <div style="background: #ffffff; border-radius: 16px; padding: 24px; border: 1px solid #e2e8f0; margin-bottom: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
                        <div style="display: flex; gap: 16px; align-items: flex-start;">
                            <div style="width: 44px; height: 44px; border-radius: 12px; background: #fff7ed; color: #c2410c; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                            </div>
                            <div style="flex-grow: 1;">
                                <h2 style="font-size: 18px; font-weight: 900; color: #0f172a; margin: 0 0 4px 0;">Reset Election Records & Archive</h2>
                                <p style="font-size: 13px; color: #64748b; margin: 0 0 16px 0; line-height: 1.5;">
                                    Generates a certified, tamper-evident PDF backup report of all current votes, resets voter status flags, and clears all ballot rows ready for a new election term. You may also download the current audit report at any time without resetting.
                                </p>
                                <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                                    <button onclick="downloadLivePdf()" style="background: #2563eb; color: white; padding: 11px 22px; border-radius: 10px; border: none; cursor: pointer; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                        Export Live Audit PDF
                                    </button>
                                    <button onclick="resetRecords()" style="background: #dc2626; color: white; padding: 11px 22px; border-radius: 10px; border: none; cursor: pointer; font-weight: 800; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);">
                                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"></polyline><polyline points="23 20 23 14 17 14"></polyline><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path></svg>
                                        Archive & Reset All Records
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Past Backups Section -->
                    <div style="background: #ffffff; border-radius: 16px; padding: 24px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
                        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                            <div style="width: 36px; height: 36px; border-radius: 10px; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center;">
                                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                            </div>
                            <h2 style="font-size: 18px; font-weight: 900; color: #0f172a; margin: 0;">Certified Election Archive & Audit Reports</h2>
                        </div>
                        <div>
                            ${backupsHtml}
                        </div>
                    </div>
                    </div>
                `;
                document.getElementById('pageContent').innerHTML = content;
            };

            window.setStatus = async (status) => {
                if(confirm(`Are you sure you want to change voting status to ${status}?`)) {
                    await api.admin.setStatus(status);
                    render();
                }
            };

            window.resetRecords = async () => {
                if(confirm('Are you ABSOLUTELY sure? This will archive current totals to a PDF report and reset voter ballots for the next election.')) {
                    await api.admin.resetRecords();
                    render();
                }
            };

            window.downloadLivePdf = async () => {
                try {
                    await api.admin.downloadPdf();
                } catch (err) {
                    alert('Error generating live audit PDF: ' + (err.message || 'Please try again.'));
                }
            };

            window.downloadArchivedPdf = async (filename) => {
                try {
                    await api.admin.downloadPdf(filename);
                } catch (err) {
                    alert('Error downloading archived PDF: ' + (err.message || 'Please try again.'));
                }
            };

            render();
        })();
    </script>
</body>
</html>
