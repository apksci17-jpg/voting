<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Official Results — Tomorrow Vote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .position-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 26px;
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
        }
        .candidate-result-row {
            margin-bottom: 18px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #edf2f7;
            transition: all 0.2s ease;
        }
        .candidate-result-row.is-winner {
            background: #f0fdf4;
            border-color: #bbf7d0;
        }
        .winner-badge {
            background: #16a34a;
            color: #ffffff;
            font-size: 11px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            letter-spacing: 0.4px;
        }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script>
        (async function() {
            const user = await initPage('admin', 'results');
            if (!user) return;

            const res = await api.admin.results();
            const { results, can_declare } = res;
            
            let totalElectionVotes = 0;
            results.forEach(pos => {
                pos.candidates.forEach(c => totalElectionVotes += (c.vote_count || 0));
            });

            let html = `
                <div class="animate-fade-in-up">
                <!-- Results Header -->
                <div style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-radius: 18px; padding: 26px 30px; margin-bottom: 28px; color: #ffffff; box-shadow: 0 8px 24px rgba(15, 23, 42, 0.2); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
                    <div>
                        <div style="display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.15); padding: 5px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 8px;">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path><path d="M4 22h16"></path><path d="M10 14.66V17c0 .55-.45 1-1 1H7v2h10v-2h-2c-.55 0-1-.45-1-1v-2.34"></path><path d="M18 4H6v7a6 6 0 0 0 12 0V4z"></path></svg>
                            OFFICIAL ELECTION TALLY
                        </div>
                        <h1 style="font-size: 26px; font-weight: 900; margin: 0 0 4px 0; color: #ffffff;">Election Results & Rankings</h1>
                        <p style="font-size: 13px; color: #94a3b8; margin: 0;">Automated real-time ballot aggregation with cryptographic integrity</p>
                    </div>
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <button id="downloadPdfBtn" onclick="downloadAuditPdf()" style="background: #2563eb; color: #ffffff; border: none; padding: 11px 20px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                            Download Audit PDF
                        </button>
                    </div>
                </div>
            `;

            for (const position of results) {
                let totalPosVotes = 0;
                for (const c of position.candidates) {
                    totalPosVotes += (c.vote_count || 0);
                }

                html += `
                    <div class="position-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; flex-wrap: wrap; gap: 10px;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <div style="width: 32px; height: 32px; border-radius: 8px; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center;">
                                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                                </div>
                                <h2 style="font-size: 20px; font-weight: 900; color: #0f172a; margin: 0;">
                                    ${position.position_name}
                                </h2>
                            </div>
                            <span style="font-size: 13px; font-weight: 700; color: #64748b; background: #f8fafc; padding: 4px 12px; border-radius: 20px; border: 1px solid #e2e8f0;">
                                Total Ballots: <strong>${totalPosVotes}</strong>
                            </span>
                        </div>
                `;

                if (!position.candidates || position.candidates.length === 0) {
                    html += `<div style="color: #64748b; font-size: 13px; padding: 14px 0;">No candidates registered for this position.</div>`;
                } else {
                    let rank = 1;
                    for (const cand of position.candidates) {
                        const count = cand.vote_count || 0;
                        const percentage = totalPosVotes > 0 ? ((count / totalPosVotes) * 100).toFixed(1) : "0.0";
                        const isLeading = (rank === 1 && count > 0);

                        html += `
                            <div class="candidate-result-row ${isLeading ? 'is-winner' : ''}">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                                    <div style="display: flex; align-items: center; gap: 10px;">
                                        <div style="font-weight: 900; font-size: 15px; color: #0f172a;">
                                            ${cand.candidate_name}
                                        </div>
                                        <span style="font-size: 11px; font-weight: 600; color: #64748b; background: rgba(0,0,0,0.04); padding: 2px 6px; border-radius: 4px;">${cand.year_level || ''}</span>
                                        ${isLeading ? `
                                            <span class="winner-badge">
                                                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                WINNER / LEADING
                                            </span>
                                        ` : ''}
                                    </div>
                                    <div style="font-weight: 900; font-size: 15px; color: ${isLeading ? '#15803d' : '#2563eb'};">
                                        ${count} votes <span style="font-size: 13px; color: #64748b; font-weight: 700;">(${percentage}%)</span>
                                    </div>
                                </div>
                                <div style="width: 100%; height: 10px; background: #e2e8f0; border-radius: 6px; overflow: hidden;">
                                    <div style="width: ${percentage}%; height: 100%; background: ${isLeading ? 'linear-gradient(90deg, #16a34a, #22c55e)' : 'linear-gradient(90deg, #2563eb, #3b82f6)'}; border-radius: 6px; transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);"></div>
                                </div>
                            </div>
                        `;
                        rank++;
                    }
                }
                html += `</div>`;
            }
            html += `</div>`;

            document.getElementById('pageContent').innerHTML = html;

            window.downloadAuditPdf = async () => {
                const btn = document.getElementById('downloadPdfBtn');
                const origHtml = btn ? btn.innerHTML : '';
                if (btn) {
                    btn.disabled = true;
                    btn.innerHTML = `
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="spinner-svg" style="animation: spinnerRotate 1s linear infinite;"><circle cx="12" cy="12" r="10"></circle></svg>
                        <span>Generating Report...</span>
                    `;
                }
                try {
                    await api.admin.downloadPdf();
                } catch (err) {
                    alert('Error generating PDF report: ' + (err.message || 'Please try again.'));
                } finally {
                    if (btn) {
                        btn.disabled = false;
                        btn.innerHTML = origHtml;
                    }
                }
            };
        })();
    </script>
</body>
</html>
