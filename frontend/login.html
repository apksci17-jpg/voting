<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tomorrow Vote — Secure Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .login-subtitle {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            margin-top: -6px;
            margin-bottom: 24px;
            letter-spacing: 0.2px;
        }

        .login-label {
            display: block;
            text-align: left;
            font-size: 12px;
            font-weight: 800;
            color: #334155;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 4px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #0f172a;
        }

        .login-footer-text {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .btn-signin {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-signin:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-outer-frame">
        <div class="login-card animate-scale-in">
            <!-- Floating Emblem Logo -->
            <div class="emblem-logo">
                <img src="assets/images/logo.png" alt="Tomorrow Vote Emblem">
            </div>

            <!-- Header Titles -->
            <h1 class="login-title">Tomorrow Vote</h1>
            <p class="login-subtitle">For the voters, use your school account</p>

            <!-- Error Banner -->
            <div id="errorBox" class="login-alert-failed" style="display: none;"></div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username" class="login-label">Student Number / Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="login-input" 
                        placeholder="Student Number or Username" 
                        autocomplete="username" 
                        required 
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="login-label">Password</label>
                    <div class="password-container">
                        <input 
                            type="password" 
                            id="password" 
                            class="login-input" 
                            placeholder="Password" 
                            autocomplete="current-password" 
                            required
                        >
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-signin" id="submitBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Secure Login</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </form>

            <div class="login-footer-text">
                Bestlink College of the Philippines &bull; Supreme Student Council
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const eyeSvg = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const eyeOffSvg = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleBtn.innerHTML = isPassword ? eyeOffSvg : eyeSvg;
        });

        // Form submission handling
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const submitBtn = document.getElementById('submitBtn');

            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Verifying Credentials...</span>';

            try {
                const res = await api.auth.login(username, password);
                if (res.success && res.token) {
                    api.setToken(res.token);
                    submitBtn.innerHTML = '<span>Login Successful! Redirecting...</span>';
                    
                    if (res.user.role === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        window.location.href = 'voter/dashboard.html';
                    }
                } else {
                    throw new Error(res.error || 'Invalid credentials');
                }
            } catch (err) {
                errorBox.style.display = 'block';
                errorBox.innerText = err.message || 'Invalid username or password.';
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Secure Login</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                `;
            }
        });
    </script>
</body>
</html>
