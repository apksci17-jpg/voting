<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Tomorrow Vote — Secure Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .login-subtitle {
            font-size: 13px;
            color: #64748b;
            font-weight: 600;
            margin-top: -6px;
            margin-bottom: 24px;
            letter-spacing: 0.2px;
        }

        .login-label {
            display: block;
            text-align: left;
            font-size: 12px;
            font-weight: 800;
            color: #334155;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 4px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: #0f172a;
        }

        .login-footer-text {
            margin-top: 24px;
            font-size: 12px;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .btn-signin {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-signin:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-outer-frame">
        <div class="login-card animate-scale-in">
            <!-- Floating Emblem Logo -->
            <div class="emblem-logo">
                <img src="assets/images/logo.png" alt="Tomorrow Vote Emblem">
            </div>

            <!-- Header Titles -->
            <h1 class="login-title">Tomorrow Vote</h1>
            <p class="login-subtitle" id="pageSubtitle">For the voters, use your school account</p>

            <!-- Error Banner -->
            <div id="errorBox" class="login-alert-failed" style="display: none;"></div>

            <!-- Primary Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="username" class="login-label">Student Number / Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="login-input" 
                        placeholder="Student Number or Username" 
                        autocomplete="username" 
                        required 
                        autofocus
                    >
                </div>

                <div class="form-group">
                    <label for="password" class="login-label">Password</label>
                    <div class="password-container">
                        <input 
                            type="password" 
                            id="password" 
                            class="login-input" 
                            placeholder="Password" 
                            autocomplete="current-password" 
                            required
                        >
                        <button type="button" class="password-toggle" id="togglePassword" aria-label="Toggle password visibility">
                            <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-signin" id="submitBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Secure Login</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </form>

            <!-- 2FA Email OTP Verification Form -->
            <form id="otpForm" class="login-form" style="display: none;">
                <div style="background: #eff6ff; border: 1.5px solid #bfdbfe; border-radius: 12px; padding: 14px 16px; margin-bottom: 20px; display: flex; align-items: flex-start; gap: 12px; text-align: left;">
                    <div style="color: #2563eb; flex-shrink: 0; margin-top: 2px;">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                            <polyline points="22,6 12,13 2,6"></polyline>
                        </svg>
                    </div>
                    <div>
                        <div style="font-size: 13px; font-weight: 800; color: #1e3a8a;">Code Sent to Email</div>
                        <div style="font-size: 12px; color: #3b82f6; margin-top: 2px; word-break: break-all;">
                            We sent a 6-digit code to <strong id="otpMaskedEmail" style="color: #1e40af;"></strong>
                        </div>
                    </div>
                </div>

                <div id="otpNoticeBox" style="display: none; background: #fffbeb; border: 1.5px solid #fde68a; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 12px; color: #92400e; text-align: left; line-height: 1.5;">
                    <div style="font-weight: 800; margin-bottom: 3px; display: flex; align-items: center; gap: 6px;">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        <span>Cloud Host Firewall Notice</span>
                    </div>
                    <div id="otpNoticeText"></div>
                </div>

                <div class="form-group">
                    <label for="otpCode" class="login-label" style="text-align: center; display: block;">Enter 6-Digit Code</label>
                    <input 
                        type="text" 
                        id="otpCode" 
                        class="login-input" 
                        placeholder="••••••" 
                        maxlength="6" 
                        inputmode="numeric" 
                        pattern="[0-9]*" 
                        autocomplete="one-time-code"
                        style="font-size: 28px; text-align: center; letter-spacing: 10px; font-weight: 800; font-family: monospace; padding: 14px 10px;"
                        required 
                    >
                </div>

                <div id="otpTimerBox" style="text-align: center; font-size: 12px; color: #64748b; font-weight: 600; margin-bottom: 20px;">
                    Code expires in: <span id="countdownText" style="color: #2563eb; font-weight: 800;">10:00</span>
                </div>

                <button type="submit" class="btn-signin" id="verifyOtpBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Verify & Sign In</span>
                </button>

                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 13px;">
                    <button type="button" id="backToLoginBtn" style="background: none; border: none; color: #64748b; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 6px 0; touch-action: manipulation;">
                        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="19" y1="12" x2="5" y2="12"></line>
                            <polyline points="12 19 5 12 12 5"></polyline>
                        </svg>
                        <span>Back to Login</span>
                    </button>
                    <button type="button" id="resendOtpBtn" style="background: none; border: none; color: #2563eb; font-weight: 800; cursor: pointer; padding: 6px 0; touch-action: manipulation;">
                        Resend Code
                    </button>
                </div>
            </form>

            <div class="login-footer-text">
                Bestlink College of the Philippines &bull; Supreme Student Council
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const eyeSvg = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const eyeOffSvg = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        // Password visibility toggle
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        toggleBtn.addEventListener('click', () => {
            const isPassword = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
            toggleBtn.innerHTML = isPassword ? eyeOffSvg : eyeSvg;
        });

        let activeOtpUserId = null;
        let countdownInterval = null;
        let resendCooldownInterval = null;
        let resendCooldownSecs = 0;

        function startOtpCountdown(durationSeconds = 600) {
            clearInterval(countdownInterval);
            let remaining = durationSeconds;
            const textEl = document.getElementById('countdownText');
            
            function update() {
                const mins = Math.floor(remaining / 60);
                const secs = remaining % 60;
                textEl.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    textEl.innerText = 'Expired';
                    textEl.style.color = '#ef4444';
                }
                remaining--;
            }
            update();
            countdownInterval = setInterval(update, 1000);
        }

        function startResendCooldown(seconds = 30) {
            clearInterval(resendCooldownInterval);
            resendCooldownSecs = seconds;
            const resendBtn = document.getElementById('resendOtpBtn');
            resendBtn.disabled = true;
            resendBtn.style.opacity = '0.6';
            resendBtn.style.cursor = 'not-allowed';

            function update() {
                if (resendCooldownSecs > 0) {
                    resendBtn.innerText = `Resend in ${resendCooldownSecs}s`;
                    resendCooldownSecs--;
                } else {
                    clearInterval(resendCooldownInterval);
                    resendBtn.disabled = false;
                    resendBtn.style.opacity = '1';
                    resendBtn.style.cursor = 'pointer';
                    resendBtn.innerText = 'Resend Code';
                }
            }
            update();
            resendCooldownInterval = setInterval(update, 1000);
        }

        function showOtpStep(otpUserId, maskedEmail, devOtp = '', cloudNotice = '') {
            activeOtpUserId = otpUserId;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('otpForm').style.display = 'block';
            document.getElementById('otpMaskedEmail').innerText = maskedEmail;
            document.getElementById('pageSubtitle').innerText = 'Two-Factor Email Verification';
            document.getElementById('errorBox').style.display = 'none';

            const noticeBox = document.getElementById('otpNoticeBox');
            const noticeText = document.getElementById('otpNoticeText');
            const codeInput = document.getElementById('otpCode');

            if (devOtp) {
                noticeBox.style.display = 'block';
                noticeText.innerHTML = `Cloud host egress blocked SMTP ports (Code 110). For testing, your verification code is: <strong style="font-size: 15px; color: #b45309; letter-spacing: 2px;">${devOtp}</strong>`;
                codeInput.value = devOtp;
            } else {
                noticeBox.style.display = 'none';
                codeInput.value = '';
            }

            codeInput.focus();
            startOtpCountdown(600);
            startResendCooldown(30);
        }

        function showLoginStep() {
            clearInterval(countdownInterval);
            clearInterval(resendCooldownInterval);
            activeOtpUserId = null;
            document.getElementById('otpForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('pageSubtitle').innerText = 'For the voters, use your school account';
            document.getElementById('errorBox').style.display = 'none';
            document.getElementById('password').value = '';
            document.getElementById('submitBtn').disabled = false;
            document.getElementById('submitBtn').innerHTML = `
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <span>Secure Login</span>
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
            `;
            document.getElementById('password').focus();
        }

        document.getElementById('backToLoginBtn').addEventListener('click', showLoginStep);

        // Form submission handling for primary login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const submitBtn = document.getElementById('submitBtn');

            errorBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Verifying Credentials...</span>';

            try {
                const res = await api.auth.login(username, password);

                // If voter requires 2FA OTP verification:
                if (res.success && res.requires_otp) {
                    showOtpStep(res.otp_user_id, res.masked_email, res.dev_otp || '', res.cloud_notice || '');
                    return;
                }

                // If admin or direct login:
                if (res.success && res.token) {
                    api.setToken(res.token);
                    submitBtn.innerHTML = '<span>Login Successful! Redirecting...</span>';
                    
                    if (res.user.role === 'admin') {
                        window.location.href = 'admin/dashboard.html';
                    } else {
                        window.location.href = 'voter/dashboard.html';
                    }
                } else {
                    throw new Error(res.error || 'Invalid credentials');
                }
            } catch (err) {
                errorBox.style.display = 'block';
                errorBox.innerText = err.message || 'Invalid username or password.';
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    <span>Secure Login</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                `;
            }
        });

        // Form submission handling for OTP verification
        document.getElementById('otpForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otpCode = document.getElementById('otpCode').value.trim();
            const errorBox = document.getElementById('errorBox');
            const verifyBtn = document.getElementById('verifyOtpBtn');

            if (!otpCode || otpCode.length !== 6) {
                errorBox.style.display = 'block';
                errorBox.className = 'login-alert-failed';
                errorBox.innerText = 'Please enter a valid 6-digit verification code.';
                return;
            }

            errorBox.style.display = 'none';
            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<span>Verifying Code...</span>';

            try {
                const res = await api.auth.verifyOtp(activeOtpUserId, otpCode);
                if (res.success && res.token) {
                    api.setToken(res.token);
                    verifyBtn.innerHTML = '<span>Verified! Redirecting...</span>';
                    window.location.href = 'voter/dashboard.html';
                } else {
                    throw new Error(res.error || 'Invalid verification code');
                }
            } catch (err) {
                errorBox.style.display = 'block';
                errorBox.className = 'login-alert-failed';
                errorBox.innerText = err.message || 'Incorrect verification code. Please check your email.';
                verifyBtn.disabled = false;
                verifyBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                    <span>Verify & Continue</span>
                `;
                document.getElementById('otpCode').select();
            }
        });

        // Resend OTP handler
        document.getElementById('resendOtpBtn').addEventListener('click', async () => {
            if (resendCooldownSecs > 0 || !activeOtpUserId) return;
            const errorBox = document.getElementById('errorBox');
            errorBox.style.display = 'none';

            try {
                const res = await api.auth.resendOtp(activeOtpUserId);
                if (res.success) {
                    startResendCooldown(30);
                    startOtpCountdown(600);

                    const noticeBox = document.getElementById('otpNoticeBox');
                    const noticeText = document.getElementById('otpNoticeText');
                    if (res.dev_otp) {
                        noticeBox.style.display = 'block';
                        noticeText.innerHTML = `Cloud host egress blocked SMTP ports (Code 110). New verification code is: <strong style="font-size: 15px; color: #b45309; letter-spacing: 2px;">${res.dev_otp}</strong>`;
                        document.getElementById('otpCode').value = res.dev_otp;
                    } else {
                        document.getElementById('otpCode').value = '';
                    }

                    document.getElementById('otpCode').focus();
                    errorBox.style.display = 'block';
                    errorBox.style.background = '#f0fdf4';
                    errorBox.style.color = '#166534';
                    errorBox.style.border = '1px solid #bbf7d0';
                    errorBox.innerText = res.message || 'A fresh verification code has been dispatched.';
                    setTimeout(() => {
                        errorBox.style.background = '';
                        errorBox.style.color = '';
                        errorBox.style.border = '';
                        errorBox.style.display = 'none';
                    }, 4500);
                } else {
                    throw new Error(res.error || 'Failed to resend verification code');
                }
            } catch (err) {
                errorBox.style.display = 'block';
                errorBox.style.background = '';
                errorBox.style.color = '';
                errorBox.style.border = '';
                errorBox.innerText = err.message || 'Failed to resend code. Please try again.';
            }
        });

        // Auto-submit when 6 digits are typed
        document.getElementById('otpCode').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
            if (e.target.value.length === 6) {
                document.getElementById('otpForm').requestSubmit();
            }
        });
    </script>
</body>
</html>
