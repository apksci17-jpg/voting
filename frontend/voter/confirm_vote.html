<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <title>Review & Cast Ballot — Tomorrow Vote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .review-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #f1f5f9;
            transition: background 0.15s ease;
        }
        .review-row:last-child {
            border-bottom: none;
        }
        .review-row:hover {
            background: #f8fafc;
        }
        .bio-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 700;
            color: #047857;
            background: #ecfdf5;
            padding: 5px 12px;
            border-radius: 99px;
            border: 1px solid #a7f3d0;
        }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>

    <!-- Biometric Fallback & Password Confirmation Modal -->
    <div id="voterAuthModal" style="display: none; position: fixed; inset: 0; z-index: 99999; background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px;">
        <div style="background: #ffffff; border-radius: 24px; max-width: 430px; width: 100%; padding: 28px 24px; box-shadow: 0 25px 50px -12px rgba(15, 23, 42, 0.35); border: 1px solid rgba(226, 232, 240, 0.9); text-align: center; position: relative;">
            <div style="width: 54px; height: 54px; border-radius: 16px; background: #ecfdf5; color: #059669; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h2 style="font-size: 20px; font-weight: 900; color: #0f172a; margin: 0 0 6px 0; letter-spacing: -0.3px;">Security Verification</h2>
            <p id="voterAuthModalDesc" style="font-size: 13px; color: #64748b; margin: 0 0 20px 0; line-height: 1.5;">
                Please enter your voter account password to confirm your identity and cast your ballot.
            </p>

            <div id="modalErrorBox" style="display: none; background: #fef2f2; color: #991b1b; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; font-size: 12px; font-weight: 700; border: 1px solid #fecaca; text-align: left;"></div>

            <form id="voterPasswordForm">
                <div style="position: relative; margin-bottom: 22px; text-align: left;">
                    <label for="voterAuthPassword" style="display: block; font-size: 11px; font-weight: 800; color: #334155; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;">Voter Password</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input 
                            type="password" 
                            id="voterAuthPassword" 
                            class="login-input" 
                            placeholder="Enter your password" 
                            required 
                            autocomplete="current-password"
                            style="width: 100%; padding-right: 44px; margin-bottom: 0;"
                        >
                        <button type="button" id="modalTogglePwd" style="position: absolute; right: 10px; background: none; border: none; cursor: pointer; color: #64748b; padding: 6px; display: flex; align-items: center; justify-content: center;" aria-label="Toggle password visibility">
                            <svg id="modalEyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div style="display: flex; gap: 12px; justify-content: flex-end;">
                    <button type="button" id="modalCancelBtn" style="background: #f1f5f9; color: #475569; border: 1.5px solid #cbd5e1; padding: 12px 20px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer; flex: 1;">Cancel</button>
                    <button type="submit" id="modalSubmitBtn" style="background: linear-gradient(135deg, #15803d 0%, #16a34a 100%); color: #ffffff; border: none; padding: 12px 22px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; flex: 1.5; box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);">
                        <span>Verify & Cast</span>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script>
        (async function() {
            const user = await initPage('voter', 'ballot');
            if (!user) return;

            const selectionsJson = sessionStorage.getItem('ballot_selections');
            if (!selectionsJson) {
                window.location.href = 'ballot.html';
                return;
            }

            const selections = JSON.parse(selectionsJson);
            const isBioSupported = await api.biometrics.isAvailable();
            
            let html = `
                <div class="animate-fade-in-up">
                    <!-- Warning Notice Banner -->
                    <div style="background: #fefce8; border-radius: 18px; padding: 24px 28px; margin-bottom: 24px; border: 1.5px solid #fef08a; display: flex; gap: 16px; align-items: flex-start; box-shadow: 0 4px 15px rgba(234, 179, 8, 0.08);">
                        <div style="width: 44px; height: 44px; border-radius: 12px; background: #fef08a; color: #854d0e; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        </div>
                        <div>
                            <h1 style="font-size: 20px; font-weight: 900; margin: 0 0 4px 0; color: #854d0e;">Final Ballot Verification</h1>
                            <p style="font-size: 13px; font-weight: 500; color: #a16207; margin: 0; line-height: 1.5;">
                                Please verify your selected candidates below. Once cast, your choices are permanently sealed with AES-256-CBC encryption into the database and cannot be altered.
                            </p>
                            ${isBioSupported ? `
                                <div style="margin-top: 10px;">
                                    <span class="bio-badge">
                                        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M12 11c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"></path>
                                            <path d="M12 2a10 10 0 0 0-7.07 17.07"></path>
                                            <path d="M19.07 4.93A10 10 0 0 1 22 12c0 2.76-1.12 5.26-2.93 7.07"></path>
                                        </svg>
                                        <span>Biometric Authentication Enabled</span>
                                    </span>
                                </div>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Ballot Selections Summary Box -->
                    <div style="background: #ffffff; border-radius: 18px; border: 1px solid #e2e8f0; margin-bottom: 28px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); overflow: hidden;">
                        <div style="padding: 18px 24px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between;">
                            <div style="font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.6px;">Position</div>
                            <div style="font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.6px;">Your Choice</div>
                        </div>
                        <div>
            `;

            for (const [posId, data] of Object.entries(selections)) {
                html += `
                    <div class="review-row">
                        <div>
                            <span style="font-size: 11px; font-weight: 800; color: #2563eb; background: #eff6ff; padding: 3px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px;">
                                ${data.position_name}
                            </span>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <span style="font-weight: 900; color: #0f172a; font-size: 16px;">${data.candidate_name}</span>
                            <div style="width: 22px; height: 22px; border-radius: 50%; background: #dcfce7; color: #16a34a; display: flex; align-items: center; justify-content: center;">
                                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </div>
                        </div>
                    </div>
                `;
            }

            html += `
                        </div>
                    </div>

                    <div id="errorBox" style="display: none; background: #fee2e2; color: #990000; padding: 16px; border-radius: 12px; margin-bottom: 24px; font-weight: 700; text-align: center; border: 1px solid #fecaca;"></div>
                    
                    <!-- Action Controls -->
                    <div style="display: flex; gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap;">
                        <a href="ballot.html" style="background: #ffffff; color: #475569; border: 1.5px solid #cbd5e1; padding: 14px 24px; border-radius: 12px; font-size: 14px; font-weight: 800; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease;">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                            <span>Edit Selections</span>
                        </a>

                        <button id="castBtn" style="background: linear-gradient(135deg, #15803d 0%, #16a34a 100%); color: #ffffff; padding: 14px 32px; border-radius: 12px; font-size: 15px; font-weight: 900; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 18px rgba(22, 163, 74, 0.35); transition: all 0.2s ease;">
                            ${isBioSupported ? `
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 11c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"></path>
                                    <path d="M12 2a10 10 0 0 0-7.07 17.07"></path>
                                    <path d="M19.07 4.93A10 10 0 0 1 22 12c0 2.76-1.12 5.26-2.93 7.07"></path>
                                </svg>
                                <span>Verify Biometrics & Cast</span>
                            ` : `
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                                </svg>
                                <span>Cast Official Ballot</span>
                            `}
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('pageContent').innerHTML = html;

            // --- Password Modal Helpers ---
            const modal = document.getElementById('voterAuthModal');
            const descEl = document.getElementById('voterAuthModalDesc');
            const input = document.getElementById('voterAuthPassword');
            const modalErr = document.getElementById('modalErrorBox');
            const cancelBtn = document.getElementById('modalCancelBtn');
            const submitBtn = document.getElementById('modalSubmitBtn');
            const togglePwdBtn = document.getElementById('modalTogglePwd');

            const eyeSvg = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
            const eyeOffSvg = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

            togglePwdBtn.addEventListener('click', () => {
                const isPwd = input.getAttribute('type') === 'password';
                input.setAttribute('type', isPwd ? 'text' : 'password');
                togglePwdBtn.innerHTML = isPwd ? eyeOffSvg : eyeSvg;
            });

            function openPasswordModal(customDesc = '') {
                if (customDesc) descEl.innerText = customDesc;
                modalErr.style.display = 'none';
                input.value = '';
                submitBtn.disabled = false;
                submitBtn.innerHTML = `
                    <span>Verify & Cast</span>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                `;
                modal.style.display = 'flex';
                input.focus();
            }

            function closePasswordModal() {
                modal.style.display = 'none';
            }

            cancelBtn.addEventListener('click', closePasswordModal);

            // Execute ballot submission helper
            async function executeCastVote(password = '') {
                const castButton = document.getElementById('castBtn');
                castButton.disabled = true;
                castButton.innerHTML = `
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
                    <span>Encrypting & Casting Ballot...</span>
                `;
                const errorBox = document.getElementById('errorBox');
                errorBox.style.display = 'none';

                const votes = {};
                for (const [posId, data] of Object.entries(selections)) {
                    votes[posId] = data.candidate_id;
                }

                try {
                    const res = await api.voter.castVote(votes, password);
                    if (res.success) {
                        sessionStorage.removeItem('ballot_selections');
                        sessionStorage.setItem('last_vote_receipt', JSON.stringify({
                            timestamp: res.timestamp,
                            email_sent: res.email_sent,
                            email: res.email,
                            student_id: res.student_id,
                            verification_hash: res.verification_hash,
                            notice: res.notice
                        }));
                        window.location.href = 'dashboard.html';
                    } else {
                        throw new Error(res.error || 'Submission failed');
                    }
                } catch (err) {
                    errorBox.style.display = 'block';
                    errorBox.innerText = 'Submission Error: ' + err.message;
                    castButton.disabled = false;
                    castButton.innerHTML = isBioSupported ? `
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 11c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"></path>
                            <path d="M12 2a10 10 0 0 0-7.07 17.07"></path>
                            <path d="M19.07 4.93A10 10 0 0 1 22 12c0 2.76-1.12 5.26-2.93 7.07"></path>
                        </svg>
                        <span>Verify Biometrics & Cast</span>
                    ` : `
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                        <span>Cast Official Ballot</span>
                    `;
                }
            }

            // Primary vote confirmation handler
            document.getElementById('castBtn').addEventListener('click', async () => {
                const errorBox = document.getElementById('errorBox');
                errorBox.style.display = 'none';

                // Check biometrics availability on this device
                const hasBiometrics = await api.biometrics.isAvailable();

                if (hasBiometrics) {
                    const castButton = document.getElementById('castBtn');
                    castButton.disabled = true;
                    castButton.innerHTML = `
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
                        <span>Scan Fingerprint / Face ID...</span>
                    `;

                    try {
                        await api.biometrics.verify({
                            title: 'Biometric Verification',
                            subtitle: 'Confirm Voter Identity',
                            description: 'Please scan your fingerprint or face to authenticate and cast your official ballot.',
                            negativeButtonText: 'Use Password'
                        });

                        // Biometrics succeeded! Cast the ballot immediately:
                        await executeCastVote();
                        return;
                    } catch (bioErr) {
                        console.log('Biometric verification cancelled or unavailable, falling back to password:', bioErr);
                        castButton.disabled = false;
                        castButton.innerHTML = `
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 11c0 1.66-1.34 3-3 3s-3-1.34-3-3 1.34-3 3-3 3 1.34 3 3z"></path>
                                <path d="M12 2a10 10 0 0 0-7.07 17.07"></path>
                                <path d="M19.07 4.93A10 10 0 0 1 22 12c0 2.76-1.12 5.26-2.93 7.07"></path>
                            </svg>
                            <span>Verify Biometrics & Cast</span>
                        `;
                        // Fall back to password verification modal
                        openPasswordModal('Biometric authentication cancelled or unavailable. Please enter your account password to verify your identity and cast your ballot.');
                        return;
                    }
                }

                // If biometric hardware is not available on this device:
                openPasswordModal('Biometric hardware is not configured on this device. Please enter your account password to verify your identity and cast your ballot.');
            });

            // Password modal form submission
            document.getElementById('voterPasswordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const password = input.value;
                modalErr.style.display = 'none';
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<span>Verifying Password...</span>';

                try {
                    const checkRes = await api.voter.verifyPassword(password);
                    if (checkRes.success) {
                        closePasswordModal();
                        await executeCastVote(password);
                    } else {
                        throw new Error(checkRes.error || 'Incorrect password.');
                    }
                } catch (err) {
                    modalErr.style.display = 'block';
                    modalErr.innerText = err.message || 'Incorrect password. Verification failed.';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `
                        <span>Verify & Cast</span>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    `;
                    input.select();
                }
            });
        })();
    </script>
</body>
</html>
