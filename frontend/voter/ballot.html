<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Official Digital Ballot — Tomorrow Vote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .ballot-card-container {
            background: #ffffff;
            border-radius: 18px;
            padding: 26px;
            border: 1px solid #e2e8f0;
            margin-bottom: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }
        .cand-option-label {
            display: block;
            background: #ffffff;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px 20px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .cand-option-label:hover {
            border-color: #93c5fd;
            background: #f8fafc;
        }
        .cand-radio:checked + .cand-option-label {
            border-color: #2563eb;
            background: #eff6ff;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .check-badge {
            position: absolute;
            top: 18px;
            right: 18px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            background: #ffffff;
        }
        .cand-radio:checked + .cand-option-label .check-badge {
            background: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }
        .check-badge svg {
            display: none;
        }
        .cand-radio:checked + .cand-option-label .check-badge svg {
            display: block;
        }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script>
        (async function() {
            const user = await initPage('voter', 'ballot');
            if (!user) return;

            const dash = await api.voter.dashboard();
            if (dash.voting_status !== 'OPEN' || dash.has_voted) {
                document.getElementById('pageContent').innerHTML = `
                    <div class="animate-fade-in-up" style="background: #fee2e2; padding: 40px 30px; border-radius: 18px; text-align: center; color: #990000; border: 1px solid #fecaca; max-width: 600px; margin: 40px auto; box-shadow: 0 4px 15px rgba(220, 38, 38, 0.08);">
                        <div style="width: 56px; height: 56px; border-radius: 50%; background: #fecaca; color: #dc2626; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px auto;">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        </div>
                        <h2 style="font-size: 22px; font-weight: 900; margin: 0 0 8px 0; color: #7f1d1d;">Ballot Access Unavailable</h2>
                        <p style="font-size: 14px; margin: 0 0 20px 0; color: #991b1b; line-height: 1.5;">
                            ${dash.has_voted ? 'You have already submitted your official ballot for this election.' : 'Voting is currently closed. Ballot submissions are not accepted at this time.'}
                        </p>
                        <a href="dashboard.html" style="display: inline-flex; align-items: center; gap: 8px; background: #dc2626; color: white; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 800; font-size: 13px; box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3); transition: all 0.2s ease;">
                            Return to Dashboard
                        </a>
                    </div>
                `;
                return;
            }

            const res = await api.voter.candidates();
            const ballotCandMap = {};
            
            let html = `
                <div class="animate-fade-in-up">
                    <!-- Ballot Header -->
                    <div style="background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%); border-radius: 18px; padding: 26px 30px; margin-bottom: 28px; color: #ffffff; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.18);">
                        <div style="display: inline-flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.18); padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 8px;">
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                            SECURE DIGITAL BALLOT
                        </div>
                        <h1 style="font-size: 26px; font-weight: 900; margin: 0 0 4px 0; color: #ffffff;">Supreme Student Council 2026</h1>
                        <p style="font-size: 13px; color: #bfdbfe; margin: 0;">Select one candidate per position. Review your selections thoroughly before casting.</p>
                    </div>

                    <form id="ballotForm">
            `;

            for (const position of res.positions) {
                html += `
                    <div class="ballot-card-container">
                        <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 18px; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px;">
                            <div style="width: 28px; height: 28px; border-radius: 8px; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center;">
                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7" r="4"></circle></svg>
                            </div>
                            <h2 style="font-size: 20px; font-weight: 900; color: #0f172a; margin: 0;">
                                ${position.position_name}
                            </h2>
                            <span style="font-size: 12px; font-weight: 700; color: #64748b; background: #f8fafc; padding: 2px 10px; border-radius: 20px; border: 1px solid #e2e8f0;">
                                Choose 1 Candidate
                            </span>
                        </div>

                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;">
                `;

                for (const cand of position.candidates) {
                    cand.position_name = position.position_name;
                    ballotCandMap[cand.id] = cand;

                    html += `
                        <div style="position: relative;">
                            <input 
                                type="radio" 
                                name="pos_${position.position_id}" 
                                value="${cand.id}" 
                                id="cand_${cand.id}" 
                                class="cand-radio" 
                                style="position: absolute; opacity: 0;"
                                data-name="${cand.candidate_name}" 
                                data-posname="${position.position_name}"
                            >
                            <label for="cand_${cand.id}" class="cand-option-label">
                                <div class="check-badge">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                </div>
                                <div style="display: flex; gap: 14px; align-items: center;">
                                    <div style="width: 52px; height: 52px; border-radius: 50%; background: #f1f5f9; overflow: hidden; flex-shrink: 0; border: 2.5px solid #bfdbfe; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.12);">
                                        <img src="${cand.profile_image ? '../assets/uploads/' + cand.profile_image : '../assets/uploads/default.svg'}" onerror="this.onerror=null; this.src='../assets/uploads/default.svg'" style="width: 100%; height: 100%; object-fit: cover;">
                                    </div>
                                    <div style="padding-right: 30px;">
                                        <div style="font-size: 16px; font-weight: 900; color: #0f172a; line-height: 1.3;">${cand.candidate_name}</div>
                                        <div style="font-size: 12px; font-weight: 700; color: #2563eb; margin-top: 2px;">${cand.year_level || 'Student Nominee'}</div>
                                    </div>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; padding-top: 8px; border-top: 1px dashed #e2e8f0;">
                                    <button type="button" class="cand-info-pill-btn" onclick="event.preventDefault(); event.stopPropagation(); openBallotCandModal(${cand.id});" aria-label="View platform for ${cand.candidate_name}">
                                        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                                        <span>Platform Info</span>
                                    </button>
                                    <span style="font-size: 11px; font-weight: 700; color: #64748b;">Tap card to select</span>
                                </div>
                            </label>
                        </div>
                    `;
                }

                html += `
                        </div>
                    </div>
                `;
            }

            html += `
                        <div style="text-align: center; margin-top: 32px; padding: 20px 0;">
                            <button type="submit" style="background: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%); color: #ffffff; padding: 16px 36px; border-radius: 14px; font-size: 16px; font-weight: 900; border: none; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 6px 20px rgba(37, 99, 235, 0.35); transition: all 0.2s ease;">
                                <span>Review Selected Ballot</span>
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </button>
                        </div>
                    </form>
                </div>
            `;

            document.getElementById('pageContent').innerHTML = html;

            window.openBallotCandModal = (id) => {
                const candidate = ballotCandMap[id];
                if (candidate) {
                    showCandidateModal(candidate, {
                        isBallot: true,
                        canSelect: true,
                        onSelect: (c) => {
                            const radio = document.getElementById('cand_' + c.id);
                            if (radio) {
                                radio.checked = true;
                                const label = document.querySelector(`label[for="cand_${c.id}"]`);
                                if (label) {
                                    label.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                }
                            }
                        }
                    });
                }
            };

            document.getElementById('ballotForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const selections = {};
                let hasSelections = false;
                
                for (const [key, value] of formData.entries()) {
                    if (key.startsWith('pos_')) {
                        const posId = key.replace('pos_', '');
                        const input = document.querySelector(`input[name="${key}"]:checked`);
                        if (input) {
                            selections[posId] = {
                                candidate_id: value,
                                candidate_name: input.dataset.name,
                                position_name: input.dataset.posname
                            };
                            hasSelections = true;
                        }
                    }
                }

                if (!hasSelections) {
                    alert("Please select at least one candidate before proceeding to review.");
                    return;
                }

                sessionStorage.setItem('ballot_selections', JSON.stringify(selections));
                window.location.href = 'confirm_vote.html';
            });
        })();
    </script>
</body>
</html>
