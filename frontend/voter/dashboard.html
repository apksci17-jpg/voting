<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Voter Dashboard — Tomorrow Vote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .voter-hero {
            background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
            border-radius: 20px;
            padding: 32px 36px;
            color: #ffffff;
            margin-bottom: 28px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.2);
            position: relative;
            overflow: hidden;
        }
        .voter-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 24px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.2s ease;
        }
        .voter-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
        }
        .btn-vote-now {
            background: linear-gradient(135deg, #16a34a 0%, #15803d 100%);
            color: #ffffff;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 800;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.35);
            transition: all 0.2s ease;
        }
        .btn-vote-now:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(22, 163, 74, 0.45);
        }
    </style>
</head>
<body>
    <div id="app" class="app-container"></div>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script>
        (async function() {
            const user = await initPage('voter', 'dashboard');
            if (!user) return;

            try {
                const res = await api.voter.dashboard();
                if (res.success) {
                    const content = document.getElementById('pageContent');
                    const hasVoted = res.has_voted;
                    const isOpen = res.voting_status === 'OPEN';

                    let html = `
                        <div class="animate-fade-in-up">
                            <!-- Hero Welcome -->
                            <div class="voter-hero">
                                <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(255, 255, 255, 0.18); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-bottom: 12px;">
                                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                                    SUPREME STUDENT COUNCIL ELECTIONS 2026
                                </div>
                                <h1 style="font-size: 28px; font-weight: 900; margin: 0 0 6px 0; color: #ffffff;">Mabuhay, ${res.user.full_name}!</h1>
                                <p style="font-size: 14px; color: #bfdbfe; margin: 0; max-width: 600px; line-height: 1.5;">
                                    Welcome to the official Tomorrow Vote digital portal. Every student voice shapes our college community leadership.
                                </p>
                            </div>

                            <!-- Status Cards Grid -->
                            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 28px;">
                                <!-- Ballot Status Card -->
                                <div class="voter-card">
                                    <div>
                                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                            <div style="font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.6px; display: inline-flex; align-items: center; gap: 6px;">
                                                <span class="pulse-dot" style="width: 8px; height: 8px; background: ${hasVoted ? '#16a34a' : '#f59e0b'};"></span>
                                                Your Ballot Status
                                            </div>
                                            <div style="width: 40px; height: 40px; border-radius: 10px; background: ${hasVoted ? '#dcfce7' : '#fee2e2'}; color: ${hasVoted ? '#16a34a' : '#dc2626'}; display: flex; align-items: center; justify-content: center;">
                                                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                                    ${hasVoted ? '<polyline points="20 6 9 17 4 12"></polyline>' : '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>'}
                                                </svg>
                                            </div>
                                        </div>
                                        <div style="font-size: 24px; font-weight: 900; color: ${hasVoted ? '#15803d' : '#b91c1c'}; margin-bottom: 6px;">
                                            ${hasVoted ? 'Official Ballot Cast' : 'Not Yet Voted'}
                                        </div>
                                        <p style="font-size: 13px; color: #64748b; margin: 0 0 16px 0; line-height: 1.4;">
                                            ${hasVoted ? 'Your vote has been verified, recorded, and sealed into the election database.' : 'You have not submitted a ballot yet. Ensure your selections are completed before polls close.'}
                                        </p>
                                    </div>
                                    <div>
                                        ${(!hasVoted && isOpen) ? `
                                            <a href="ballot.html" class="btn-vote-now">
                                                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                                                <span>Cast Your Vote Now</span>
                                            </a>
                                        ` : (hasVoted ? `
                                            <div style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 800; color: #16a34a;">
                                                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                                Ballot Recorded Successfully
                                            </div>
                                        ` : `
                                            <div style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #990000;">
                                                Polls are currently closed.
                                            </div>
                                        `)}
                                    </div>
                                </div>

                                <!-- Election Status Card -->
                                <div class="voter-card">
                                    <div>
                                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                                            <div style="font-size: 12px; font-weight: 800; color: #64748b; text-transform: uppercase; letter-spacing: 0.6px; display: inline-flex; align-items: center; gap: 6px;">
                                                <span class="pulse-dot" style="width: 8px; height: 8px; background: ${isOpen ? '#16a34a' : '#dc2626'};"></span>
                                                Election Status
                                            </div>
                                            <div style="width: 40px; height: 40px; border-radius: 10px; background: ${isOpen ? '#dcfce7' : '#fee2e2'}; color: ${isOpen ? '#16a34a' : '#dc2626'}; display: flex; align-items: center; justify-content: center;">
                                                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                                    ${isOpen ? '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>' : '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>'}
                                                </svg>
                                            </div>
                                        </div>
                                        <div style="font-size: 24px; font-weight: 900; color: ${isOpen ? '#15803d' : '#b91c1c'}; margin-bottom: 6px;">
                                            Polls are ${res.voting_status}
                                        </div>
                                        <p style="font-size: 13px; color: #64748b; margin: 0 0 16px 0; line-height: 1.4;">
                                            ${isOpen ? 'Ballot intake is actively running under Commission on Student Elections schedule.' : 'Ballot submissions are paused. Please check back during designated polling hours.'}
                                        </p>
                                    </div>
                                    <div style="display: flex; gap: 8px;">
                                        <a href="candidates.html" style="font-size: 13px; font-weight: 800; color: #2563eb; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;">
                                            View Candidate Platforms &rsaquo;
                                        </a>
                                    </div>
                                </div>
                            </div>

                            <!-- Info & Guidance Section -->
                            <div style="background: #ffffff; border-radius: 18px; padding: 26px; border: 1px solid #e2e8f0; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
                                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px;">
                                    <div style="width: 36px; height: 36px; border-radius: 10px; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center;">
                                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                                    </div>
                                    <h2 style="font-size: 18px; font-weight: 900; color: #0f172a; margin: 0;">Integrity & Security Guarantee</h2>
                                </div>
                                <p style="font-size: 13px; color: #475569; line-height: 1.6; margin: 0;">
                                    The Tomorrow Vote platform employs cryptographic security algorithms to ensure your ballot remains secret, tamper-evident, and verifiable. Once cast, ballots cannot be altered, and each authenticated student account is granted precisely one vote.
                                </p>
                            </div>
                        </div>
                    `;

                    content.innerHTML = html;
                }
            } catch (error) {
                console.error("Failed to load dashboard data", error);
                document.getElementById('pageContent').innerHTML = '<p style="color:red;">Error loading dashboard.</p>';
            }
        })();
    </script>
</body>
</html>
